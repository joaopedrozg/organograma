<!-- Background 3D -->
<canvas #threeCanvas class="webgl-bg"></canvas>

<!-- Container do Formulário Overlaid -->
<div class="login-wrapper">
  <canvas #threeCanvas class="webgl-bg"></canvas>
  <mat-card class="login-card premium-glass">
    <mat-card-header>
      <mat-card-title>Acessar Conta</mat-card-title>
      <mat-card-subtitle>Digite suas credenciais</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" class="full-width premium-input">
          <mat-label>E-mail</mat-label>
          <input matInput formControlName="email" type="email">
          <mat-icon matPrefix>email</mat-icon>
          @if (loginForm.get('email')?.hasError('required')) {
            <mat-error>Campo obrigatório</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width premium-input">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hidePassword() ? 'password' : 'text'" formControlName="password">
          <mat-icon matPrefix>lock</mat-icon>
          <button type="button" mat-icon-button matSuffix (click)="togglePassword($event)">
            <mat-icon>{{hidePassword() ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          type="submit"
          class="full-width submit-btn premium-btn"
          [disabled]="loginForm.invalid">
          Entrar
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
